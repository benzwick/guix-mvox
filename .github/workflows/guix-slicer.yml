name: Guix Slicer

# Verify that the Slicer package resolves when both mvox and systole
# channels are present, and install mvox alongside the channel.
#
# The full Slicer build is too large for GitHub Actions runners
# (guix-systole disables it in CI for the same reason), so we use
# --dry-run to validate the dependency graph without compiling.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5

    # Ensure a local "main" branch exists for the file:// channel URL.
    # On manual dispatch from a non-main branch, actions/checkout may
    # not create a local "main" branch, causing guix pull to fail.
    - name: Create main branch for local channel
      run: git branch -f main HEAD 2>/dev/null || true

    - name: Install Guix
      run: |
        sudo apt-get update
        sudo apt-get install -y guix
        echo "LANG=en_US.utf8" >> $GITHUB_ENV

    - name: Configure channels
      run: |
        mkdir -p ~/.config/guix
        cat > ~/.config/guix/channels.scm << 'EOF'
        (list (channel
                (name 'guix)
                (url "https://codeberg.org/guix/guix.git")
                (branch "master")
                (introduction
                  (make-channel-introduction
                    "9edb3f66fd807b096b48283debdcddccfea34bad"
                    (openpgp-fingerprint
                      "BBB0 2DDF 2CEA F6A8 0D1D  E643 A2A0 6DF2 A33A 54FA"))))
              (channel
                (name 'mvox)
                (url "file:///home/runner/work/guix-mvox/guix-mvox")
                (branch "main"))
              (channel
                (name 'systole)
                (url "https://github.com/SystoleOS/guix-systole.git")
                (branch "main")))
        EOF

    - name: Update Guix
      run: |
        guix pull
        echo "$HOME/.config/guix/current/bin" >> $GITHUB_PATH

    - name: Dry-run build Slicer
      run: guix build --dry-run slicer-5.8

    - name: Dry-run build mvox
      run: guix build --dry-run mvox

    - name: Collect Guix build logs
      if: always()
      run: |
        mkdir -p guix-build-logs
        for f in /var/log/guix/drvs/*/*; do
          sudo cp "$f" guix-build-logs/ || true
        done
        gunzip guix-build-logs/*.gz 2>/dev/null || true

    - name: Upload Guix build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: guix-build-logs
        path: guix-build-logs/

    - name: Stop Guix daemon
      if: always()
      run: sudo systemctl stop guix-daemon
