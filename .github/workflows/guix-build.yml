name: Guix Build

# Build and install mvox using local package definitions.
#
# Runs "guix build -L ." and "guix install -L ." to test the package
# definitions in this repo without publishing them to the channel first.
# Use this workflow to verify package changes before pushing.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]

    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-guix

    - name: Lint packages
      continue-on-error: true
      run: guix lint -L . mfem mfem@4.5 mvox mvox-mfem-4.5

    - name: Build MFEM 4.5
      run: guix build -L . mfem@4.5

    - name: Build MFEM 4.9
      run: guix build -L . mfem

    - name: Build mvox (MFEM 4.5)
      run: guix build -L . mvox-mfem-4.5

    - name: Build mvox (MFEM 4.9)
      run: guix build -L . mvox

    - name: Smoke test mvox (MFEM 4.5)
      run: $(guix build -L . mvox-mfem-4.5)/bin/mvox --help || test $? -eq 1

    - name: Smoke test mvox (MFEM 4.9)
      run: $(guix build -L . mvox)/bin/mvox --help || test $? -eq 1

    - name: Install mvox
      run: guix install -L . mvox

    # guix install puts binaries in ~/.guix-profile/bin. On a normal
    # system, sourcing ~/.guix-profile/etc/profile adds it to PATH.
    # GitHub Actions steps run non-login shells, so add it explicitly.
    # https://guix.gnu.org/manual/en/html_node/Getting-Started.html
    - name: Add Guix profile to PATH
      run: echo "$HOME/.guix-profile/bin" >> $GITHUB_PATH

    - name: Smoke test (installed)
      run: mvox --help || test $? -eq 1

    - name: Clone mvox for tests
      uses: actions/checkout@v5
      with:
        repository: benzwick/mvox
        path: mvox-src

    - name: Test boxmesh
      working-directory: mvox-src/examples
      run: bash boxmesh.sh

    - name: Test brain-tensors
      working-directory: mvox-src/examples
      run: bash brain-tensors.sh

    - name: Collect Guix build logs
      if: always()
      run: |
        mkdir -p guix-build-logs
        for f in /var/log/guix/drvs/*/*; do
          sudo cp "$f" guix-build-logs/ || true
        done
        gunzip guix-build-logs/*.gz 2>/dev/null || true

    - name: Upload Guix build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: guix-build-logs-${{ matrix.os }}
        path: guix-build-logs/

    - name: Stop Guix daemon
      if: always()
      run: sudo pkill guix-daemon || true
