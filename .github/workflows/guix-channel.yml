name: Guix Channel

# Install mvox through the Guix channel, as an end user would.
#
# Configures the mvox channel in channels.scm, runs "guix pull" to
# fetch the channel, then installs mvox with "guix install mvox".
# This verifies that the published channel works correctly.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]

    steps:
    - uses: actions/checkout@v5
    - uses: ./.github/actions/setup-guix
      with:
        extra-channels: |
          (channel
            (name 'mvox)
            (url "https://github.com/benzwick/guix-mvox")
            (branch "main"))

    - name: Lint packages
      continue-on-error: true
      run: guix lint mfem mfem@4.5 mvox mvox-mfem-4.5

    - name: Build mvox
      run: guix build mvox

    # guix install applies grafts (security patches) on top of the
    # build.  Splitting build from install isolates graft failures.
    - name: Install mvox
      run: guix install mvox

    # guix install puts binaries in ~/.guix-profile/bin. On a normal
    # system, sourcing ~/.guix-profile/etc/profile adds it to PATH.
    # GitHub Actions steps run non-login shells, so add it explicitly.
    # https://guix.gnu.org/manual/en/html_node/Getting-Started.html
    - name: Add Guix profile to PATH
      run: echo "$HOME/.guix-profile/bin" >> $GITHUB_PATH

    - name: Smoke test (installed)
      run: mvox --help || test $? -eq 1

    - name: Clone mvox for tests
      uses: actions/checkout@v5
      with:
        repository: benzwick/mvox
        path: mvox-src

    - name: Test boxmesh
      working-directory: mvox-src/examples
      run: bash boxmesh.sh

    - name: Test brain-tensors
      working-directory: mvox-src/examples
      run: bash brain-tensors.sh

    - name: Collect Guix build logs
      if: always()
      run: |
        mkdir -p guix-build-logs
        for f in /var/log/guix/drvs/*/*; do
          sudo cp "$f" guix-build-logs/ || true
        done
        gunzip guix-build-logs/*.gz 2>/dev/null || true

    - name: Upload Guix build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: guix-build-logs-${{ matrix.os }}
        path: guix-build-logs/

    - name: Stop Guix daemon
      if: always()
      run: sudo pkill guix-daemon || true
