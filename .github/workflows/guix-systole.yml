name: Guix Systole

# Test that guix-mvox composes correctly with guix-systole.
#
# Users building a 3D Slicer custom application with MVox need both
# channels. This workflow verifies that mvox builds and works when
# the systole channel is present.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v5

    # Ensure a local "main" branch exists for the file:// channel URL.
    # On pull requests, actions/checkout creates a detached HEAD at the
    # merge ref without a "main" branch, causing guix pull to fail.
    - name: Create main branch for local channel
      run: git branch -f main HEAD 2>/dev/null || true

    - name: Install Guix
      run: |
        sudo apt-get update
        sudo apt-get install -y guix
        echo "LANG=en_US.utf8" >> $GITHUB_ENV

    - name: Configure channels
      run: |
        mkdir -p ~/.config/guix
        cat > ~/.config/guix/channels.scm << 'EOF'
        (cons* (channel
                 (name 'guix)
                 (url "https://codeberg.org/guix/guix.git")
                 (branch "master")
                 (introduction
                   (make-channel-introduction
                     "9edb3f66fd807b096b48283debdcddccfea34bad"
                     (openpgp-fingerprint
                       "BBB0 2DDF 2CEA F6A8 0D1D  E643 A2A0 6DF2 A33A 54FA"))))
               (channel
                 (name 'mvox)
                 (url "file:///home/runner/work/guix-mvox/guix-mvox")
                 (branch "main"))
               (channel
                 (name 'systole)
                 (url "https://github.com/SystoleOS/guix-systole.git")
                 (branch "main"))
               %default-channels)
        EOF

    - name: Update Guix
      run: |
        guix pull
        echo "$HOME/.config/guix/current/bin" >> $GITHUB_PATH

    - name: Lint packages
      continue-on-error: true
      run: guix lint mfem mfem@4.5 mvox mvox-mfem-4.5

    - name: Build MFEM 4.5
      run: guix build mfem@4.5

    - name: Build MFEM 4.9
      run: guix build mfem

    - name: Build mvox (MFEM 4.5)
      run: guix build mvox-mfem-4.5

    - name: Build mvox (MFEM 4.9)
      run: guix build mvox

    - name: Smoke test mvox (MFEM 4.5)
      run: $(guix build mvox-mfem-4.5)/bin/mvox --help || test $? -eq 1

    - name: Smoke test mvox (MFEM 4.9)
      run: $(guix build mvox)/bin/mvox --help || test $? -eq 1

    - name: Collect Guix build logs
      if: always()
      run: |
        mkdir -p guix-build-logs
        for f in /var/log/guix/drvs/*/*; do
          sudo cp "$f" guix-build-logs/ || true
        done
        gunzip guix-build-logs/*.gz 2>/dev/null || true

    - name: Upload Guix build logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: guix-build-logs
        path: guix-build-logs/

    - name: Stop Guix daemon
      if: always()
      run: sudo systemctl stop guix-daemon
